name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Validate release tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $cacheEntry = Get-Content -LiteralPath "build\CMakeCache.txt" |
              Where-Object { $_ -match '^CMAKE_PROJECT_VERSION:STATIC=' } |
              Select-Object -First 1
          if (-not $cacheEntry) {
            throw "CMAKE_PROJECT_VERSION was not found in the configured project"
          }
          $projectVersion = ($cacheEntry -split '=', 2)[1].Trim()
          $expectedTag = "v$projectVersion"
          if ($env:RELEASE_TAG -cne $expectedTag) {
            throw "Release tag '$env:RELEASE_TAG' must exactly match '$expectedTag'"
          }
          "PROJECT_VERSION=$projectVersion" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Release
        run: cmake --build build --config Release -- /p:TreatWarningAsError=true

      - name: Run Release checks
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Sign executable
        env:
          SIGNING_CERT_BASE64: ${{ secrets.WINDOWS_SIGNING_CERT_BASE64 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERT_PASSWORD }}
        shell: pwsh
        run: .\scripts\sign-release.ps1 -ExePath .\build\Release\gamma_changer_gui.exe

      - name: Package assets
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG
          $exe = (Resolve-Path "build\Release\gamma_changer_gui.exe").Path
          $authenticodeStatus =
              (Get-AuthenticodeSignature -LiteralPath $exe).Status.ToString()
          "AUTHENTICODE_STATUS=$authenticodeStatus" |
              Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $staging = Join-Path $env:RUNNER_TEMP ("gamma-changer-" + $tag)
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $staging "gamma_changer_gui.exe") -Force
          $zip = "gamma-changer-$tag-win-x64.zip"
          $zipPath = Join-Path $staging $zip
          Compress-Archive -Path (Join-Path $staging "gamma_changer_gui.exe") `
              -DestinationPath $zipPath -CompressionLevel Optimal
          $exeHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          $zipHash = (Get-FileHash -Algorithm SHA256 -LiteralPath $zipPath).Hash.ToLowerInvariant()
          @(
            "SHA256 ($zip) = $zipHash",
            "SHA256 (gamma_changer_gui.exe) = $exeHash"
          ) | Set-Content -LiteralPath (Join-Path $staging "SHA256SUMS.txt") -Encoding ASCII
          Copy-Item -LiteralPath $zipPath -Destination $env:RUNNER_TEMP -Force
          Copy-Item -LiteralPath $exe -Destination $env:RUNNER_TEMP -Force
          Copy-Item -LiteralPath (Join-Path $staging "SHA256SUMS.txt") `
              -Destination $env:RUNNER_TEMP -Force

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:RELEASE_TAG
          $zip = "gamma-changer-$tag-win-x64.zip"
          $notes = Join-Path $env:RUNNER_TEMP "release-notes.txt"
          @(
            "Gamma Changer $env:PROJECT_VERSION",
            "",
            "## Assets",
            "",
            "- $zip — portable ZIP containing gamma_changer_gui.exe",
            "- gamma_changer_gui.exe — Authenticode status: $env:AUTHENTICODE_STATUS",
            "- SHA256SUMS.txt — SHA-256 integrity checksums (not a digital signature)",
            "- Source code archives are attached automatically by GitHub"
          ) | Set-Content -LiteralPath $notes -Encoding UTF8
          $assets = @(
            (Join-Path $env:RUNNER_TEMP $zip),
            (Join-Path $env:RUNNER_TEMP "gamma_changer_gui.exe"),
            (Join-Path $env:RUNNER_TEMP "SHA256SUMS.txt")
          )
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $assets --repo $env:GITHUB_REPOSITORY --clobber
            gh release edit $tag `
              --repo $env:GITHUB_REPOSITORY `
              --title "Gamma Changer $tag" `
              --notes-file $notes `
              --draft
          } else {
            gh release create $tag `
              --repo $env:GITHUB_REPOSITORY `
              --draft `
              --title "Gamma Changer $tag" `
              --notes-file $notes `
              $assets
          }
